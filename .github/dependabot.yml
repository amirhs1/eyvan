version: 2

# Dependabot opens its version updates against `develop`, not the default
# branch. Every change reaches `main` through a release PR from `develop`; a
# dependency bump is not an exception. Security updates always open against
# `main`; CONTRIBUTING.md, "Branching & pull requests", says how to handle them.
# Branches, commits, and labels follow CONTRIBUTING.md, "Names".

updates:
  # Ruby gems (Gemfile / Gemfile.lock) — Jekyll, plugins, dev/test tools
  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "develop"
    pull-request-branch-name:
      prefix: "chore"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:chore"
      - "area:deps"
    schedule:
      interval: "weekly"

  # npm devDependencies — Playwright, axe-core (QA tooling only)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    pull-request-branch-name:
      prefix: "chore"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:chore"
      - "area:deps"
    schedule:
      interval: "weekly"

  # GitHub Actions used by develop.yml and jekyll-pages.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    pull-request-branch-name:
      prefix: "chore"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:chore"
      - "area:deps"
    schedule:
      interval: "weekly"
