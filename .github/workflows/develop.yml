name: Run Automated Tests

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    if: "!(github.event_name == 'pull_request' && github.head_ref == 'main' && github.base_ref == 'develop')"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          bundler-cache: true

      - name: Check Dependency Advisories
        run: bundle exec bundle-audit check --update

      - name: Classify Docs-Only Change
        id: docs
        run: ruby scripts/classify-docs-only.rb

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.docs.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build Jekyll Site
        run: bundle exec jekyll build

      - name: Test Release Checks
        run: npm run test:release

      - name: Check Generated Site Policy
        run: ruby scripts/check-built-output.rb

      - name: Check Template Identity
        run: ruby scripts/check-template-placeholders.rb

      - name: Test Color Contract Guards
        run: npm run test:colors

      - name: Check Color Contract
        run: ruby scripts/check-color-contract.rb

      - name: Start Local Jekyll Server
        if: steps.docs.outputs.docs_only != 'true'
        run: bundle exec jekyll serve --host 127.0.0.1 --port 4000 --detach

      - name: Wait for Jekyll Server
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run test:wait

      - name: Test Site Integrity
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run test:site

      - name: Run Accessibility Tests
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run test:a11y

      - name: Start Component Gallery Server
        if: steps.docs.outputs.docs_only != 'true'
        run: bundle exec jekyll serve --config _config.yml,_config.gallery.yml --destination _site-gallery --host 127.0.0.1 --port 4001 --detach

      - name: Build Gallery Search Index
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run search:index:gallery

      - name: Wait for Component Gallery Server
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run test:wait:gallery

      - name: Scan Component Gallery
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run test:gallery

      - name: Upload Test Reports if Failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
