name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          bundler-cache: true

      - name: Check Template Identity
        run: ruby scripts/check-template-placeholders.rb

      - name: Build with Jekyll
        if: github.repository != 'amirhs1/eyvan'
        run: bundle exec jekyll build

      # The template's own demo turns on the opt-in features that _config.yml
      # leaves off for forks: search, and Google Analytics with its consent
      # banner once the EYVAN_DEMO_GA_ID repository variable is set.
      - name: Build Jekyll Site With Demo Features
        if: github.repository == 'amirhs1/eyvan'
        env:
          DEMO_GA_ID: ${{ vars.EYVAN_DEMO_GA_ID }}
        run: |
          printf 'search: true\n' > "$RUNNER_TEMP/demo.yml"
          if [ -n "$DEMO_GA_ID" ]; then
            if [[ ! "$DEMO_GA_ID" =~ ^G-[A-Z0-9]+$ ]]; then
              echo "::error::EYVAN_DEMO_GA_ID must be a GA4 Measurement ID, such as G-XXXXXXXXXX."
              exit 1
            fi
            printf 'google_analytics: "%s"\n' "$DEMO_GA_ID" >> "$RUNNER_TEMP/demo.yml"
          fi
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/demo.yml"

      # _plugins/hide_search_page.rb builds /search/ only when `search: true`.
      - name: Check Search Setting
        id: search
        run: |
          if [ -f _site/search/index.html ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.search.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Build Search Index
        if: steps.search.outputs.enabled == 'true'
        run: npm ci && npm run search:index

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
