name: Run Automated Tests

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    if: "!(github.event_name == 'pull_request' && github.head_ref == 'main' && github.base_ref == 'develop')"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Jekyll Site
        run: bundle exec jekyll build

      - name: Test Release Checks
        run: npm run test:release

      - name: Check Generated Site Policy
        run: ruby scripts/check-built-output.rb

      - name: Check Template Identity
        run: ruby scripts/check-template-placeholders.rb

      - name: Test Color Contract Guards
        run: npm run test:colors

      - name: Check Color Contract
        run: ruby scripts/check-color-contract.rb

      - name: Start Local Jekyll Server
        run: bundle exec jekyll serve --host 127.0.0.1 --port 4000 --detach

      - name: Wait for Jekyll Server
        run: npx wait-on http://127.0.0.1:4000/eyvan/

      - name: Test Site Integrity
        run: npm run test:site

      - name: Run Accessibility Tests
        run: npm run test:a11y

      - name: Upload Test Reports if Failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
